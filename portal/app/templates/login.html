{% extends "base.html" %}
{% block title %}Sign in · {{ rp_name }}{% endblock %}
{% block content %}
<section class="login card">
  <h1>{{ rp_name }}</h1>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <p class="error hidden" id="passkey-error" role="alert"></p>

  <button class="primary wide" id="passkey-login" data-next="{{ next }}">Sign in with security key or passkey</button>

  <div class="divider"><span>or</span></div>

  <form method="post" action="/login/password" autocomplete="on">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Username <input name="username" autocomplete="username webauthn" required maxlength="64"></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <label>Authenticator code <span class="muted">(or a recovery code)</span>
      <input name="code" inputmode="numeric" autocomplete="one-time-code" required maxlength="20"></label>
    <button class="wide">Sign in</button>
  </form>
</section>
{% endblock %}
