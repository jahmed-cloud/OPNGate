{% extends "base.html" %}
{% block content %}
<section class="card narrow">
  <h1>Set up authenticator</h1>
  <p>Add this key to your authenticator app (manual entry, time-based, 6 digits, 30 seconds):</p>
  <p class="secret mono">{{ secret }}</p>
  <details><summary>otpauth URI</summary><p class="mono small break">{{ uri }}</p></details>
  <form method="post" action="/security/totp/confirm" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Code from the app <input name="code" inputmode="numeric" autocomplete="one-time-code" required maxlength="6"></label>
    <button class="primary">Confirm and replace</button>
  </form>
  <p class="muted small">Your old authenticator keeps working until you confirm.</p>
</section>
{% endblock %}
